name: Validar APK existente
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Workflow que gerou o APK de testes
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: npm ci
      - run: gh run download "$APK_RUN_ID" --name CarcinoGestao-APK-teste --dir apk
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-evidencias
          path: android-evidence/
          if-no-files-found: ignore
