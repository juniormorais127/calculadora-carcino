name: Validar telas e fluxos web
on:
  push:
    paths: ['src/**', 'public/**', 'build/**', 'e2e/**', 'tests/**', 'package*.json', 'playwright.config.js', '.github/workflows/web-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npx playwright test --project chromium --workers 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: falhas-telas-web
          path: test-results/
