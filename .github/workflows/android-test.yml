name: APK Android de testes
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['android/**', 'capacitor.config.json', 'src/**', 'package*.json', 'scripts/android-*.mjs', '.github/workflows/android-test.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
        env:
          VITE_ANDROID_TEST: 'true'
          VITE_BASE_PATH: /
      - name: Chave exclusiva para testes
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_TEST_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > android/app/carcino-test.keystore
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p apk && cp android/app/build/outputs/apk/debug/app-debug.apk apk/CarcinoGestao-teste.apk && sha256sum apk/CarcinoGestao-teste.apk > apk/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CarcinoGestao-APK-teste
          path: apk/
          retention-days: 30
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-evidencias
          path: android-evidence/
          if-no-files-found: ignore
